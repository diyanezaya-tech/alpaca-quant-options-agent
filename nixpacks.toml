# Instala el binario Linux oficial de Alpaca CLI (pin v0.0.13, mismo que se
# usa local en tools/alpaca.exe) en /usr/local/bin/alpaca durante el build de
# Railway, para que cli_executor.py lo encuentre vía shutil.which("alpaca")
# sin caer al fallback de Windows.

[phases.setup]
nixPkgs = ["curl", "gnutar", "gzip"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "curl -sL -o /tmp/alpaca-cli.tar.gz https://github.com/alpacahq/cli/releases/download/v0.0.13/cli_0.0.13_linux_amd64.tar.gz",
  "echo '50cd254d81b6bbc541259eeeb4bb1a8f7c319557fa49fc3b2765cddd72a66a82  /tmp/alpaca-cli.tar.gz' | sha256sum -c -",
  "tar -xzf /tmp/alpaca-cli.tar.gz -C /tmp",
  "cp /tmp/alpaca /usr/local/bin/alpaca",
  "chmod +x /usr/local/bin/alpaca",
  "alpaca --version"
]
